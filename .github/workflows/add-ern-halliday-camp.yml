# Manually-triggered one-shot: put the Ern Halliday camp (23-25 Oct 2026) on the
# LIVE app with the 36-item packing checklist for Toby and Ollie, open today.
# Attaches to an existing Ern Halliday event rather than creating a second, and
# never touches registration or payment chores. Wipes nothing.
# Never runs on its own - workflow_dispatch only.
name: Add Ern Halliday camp

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-ern-halliday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add the camp and both packing checklists
        run: node scripts/add-ern-halliday-camp.mjs
