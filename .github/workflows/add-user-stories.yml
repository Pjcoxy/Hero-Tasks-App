name: Add user stories to open issues

# One-off, run by hand. Prepends a plain-language user story to the top of each
# open issue named in ops/one-off/user-stories.json, so the backlog can be read
# and understood without opening every issue and parsing its acceptance
# criteria.
#
# Written as a script rather than done by hand because prepending means
# rewriting each full issue body, and these bodies are long markdown with code
# blocks and quoted strings. Twenty-four chances to silently mangle an issue.
# A script that reads and prepends cannot make that mistake.
#
# Idempotent: an issue whose body already carries the marker is skipped, so
# re-running adds nothing. Safe to dispatch twice.
#
# Delete this workflow once it has been run.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would change without writing anything"
        type: boolean
        default: true

permissions:
  issues: write

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepend the user story
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          MARKER="> **User story**"
          CHANGED=0; SKIPPED=0; MISSING=0

          for NUM in $(jq -r 'keys_unsorted[]' ops/one-off/user-stories.json | sort -n); do
            STORY=$(jq -r --arg n "$NUM" '.[$n]' ops/one-off/user-stories.json)

            STATE=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUM}" --jq '.state' 2>/dev/null || echo "missing")
            if [ "$STATE" != "open" ]; then
              echo "#${NUM}  skipped - ${STATE}"
              MISSING=$((MISSING + 1))
              continue
            fi

            BODY=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUM}" --jq '.body // ""')
            case "$BODY" in
              *"$MARKER"*)
                echo "#${NUM}  already has a story"
                SKIPPED=$((SKIPPED + 1))
                continue
                ;;
            esac

            NEW=$(printf '%s\n> %s\n\n---\n\n%s' "$MARKER" "$STORY" "$BODY")

            if [ "$DRY_RUN" = "true" ]; then
              echo "#${NUM}  WOULD ADD: ${STORY}"
            else
              # --field reads the value verbatim, so markdown, quotes and code
              # fences in the existing body survive untouched.
              printf '%s' "$NEW" > /tmp/body.md
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${NUM}" \
                --field body=@/tmp/body.md >/dev/null
              echo "#${NUM}  added: ${STORY}"
            fi
            CHANGED=$((CHANGED + 1))
          done

          echo ""
          echo "changed=${CHANGED}  already-had=${SKIPPED}  not-open=${MISSING}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run. Re-dispatch with dry_run unchecked to apply."
          fi
