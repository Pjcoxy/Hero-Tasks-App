name: Build queue

# Drains the build queue: every few hours, picks the next issue labelled
# 'build' that is ready to work on, and hands it to the Copilot coding agent.
#
# Why a queue rather than building on the label directly:
#   - Copilot credits are finite and monthly (~20-28 builds). Labelling four
#     sub-issues at once would blow through a daily cap, and skipped runs never
#     retry, so work would silently never get built.
#   - Sub-issues have dependencies. #34 built before #33 lands means Copilot
#     writes against an API that does not exist yet and invents one.
#
# So 'build' means "queued", and this picks one at a time, in order, skipping
# anything whose dependencies are still open.
#
# When it runs: on the events that can change what is buildable, so work starts
# as soon as it is unblocked rather than waiting for a clock:
#   - a 'build' label added        -> that issue may be ready right now
#   - a pull request closed/merged -> whatever depended on it may be unblocked
#   - an issue closed              -> same
#
# The half-hourly schedule is a FAILURE BACKSTOP, not polling.
#
# Events cover the happy path: the merge job uses a real token now, so a merged
# pull request raises its events and the queue moves the moment something
# unblocks. The five-minute sweeps that used to paper over that are gone.
#
# But events only fire when something CHANGES. Nothing fires when a run FAILS.
# That gap is not hypothetical: this workflow failed to assign #73 because the
# account's API rate limit was exhausted, and with no schedule at all nothing
# retried - the whole build stalled silently until a human noticed.
#
# So: half-hourly, purely so a transient failure heals itself. Rare enough not
# to be the noise the old sweeps were, frequent enough that nobody has to spot
# a stall.
#
# MAX_PER_RUN caps how many start at once, and it is 1 deliberately.
#
# Running builds in parallel looks faster and is not. Almost every sub-issue
# edits api/src/functions/hero.js or frontend/index.html, so concurrent Copilot
# branches conflict with each other: the first merges, the rest need a human to
# resolve, and auto-merge cannot. #57 and #58 hit this within minutes of each
# other. One at a time means each build branches off code that already contains
# the one before it, so conflicts mostly cannot arise - which is what actually
# keeps the pipeline unattended.

on:
  issues:
    types: [labeled, closed]
  pull_request:
    types: [closed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: copilot-build
  cancel-in-progress: false

jobs:
  next:
    # Skip label events for labels other than 'build' - every other event type
    # (closed issue, closed PR, schedule, manual) is worth a look at the queue.
    if: >-
      github.event_name != 'issues' ||
      github.event.action == 'closed' ||
      github.event.label.name == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pick the next buildable issue
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Open issues labelled 'build', oldest first so sub-issues are built
          # in the order the Elaborator created them.
          CANDIDATES=$(gh api "repos/${GITHUB_REPOSITORY}/issues?labels=build&state=open&sort=created&direction=asc&per_page=100" \
            --jq '[.[] | select(has("pull_request") | not) | {number, body: (.body // ""), assignees: [.assignees[].login]}]')

          MAX_PER_RUN=1
          # How many builds may be OPEN AT ONCE, across all runs. MAX_PER_RUN
          # only ever limited a single run: because an assigned issue is
          # skipped, each subsequent run handed out another one, and six
          # Copilot branches ended up in flight together. They all edit
          # frontend/index.html, so every one conflicted with main, and
          # auto-merge - which cannot resolve a conflict - jammed for hours.
          # #62 set MAX_PER_RUN=1 intending exactly this, and capped the wrong
          # thing.
          MAX_IN_FLIGHT=1

          READY=""
          PICKED=0

          COUNT=$(echo "$CANDIDATES" | jq 'length')
          echo "Issues labelled 'build': ${COUNT}"
          if [ "$COUNT" -eq 0 ]; then
            echo "Queue empty - nothing to do."
            echo "numbers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---------------------------------------------------------------
          # Is the coding agent working at all?
          #
          # Every guard below asks "did this issue get built?" and treats no as
          # the issue's fault. That is only sound while the agent is capable of
          # building anything. When the Copilot allowance runs out the agent is
          # assigned, produces nothing, and looks exactly like an issue too hard
          # to build - so the guards disqualify the backlog one issue at a time
          # while reporting success.
          #
          # That is not hypothetical: on 22 Aug the last pull request with any
          # files in it was #151 at 14:24. #135 was assigned at 19:06, produced
          # nothing because there were no credits, and was marked needs-human as
          # though it had been tried and failed. It had not been tried.
          #
          # So: if no Copilot pull request has contained a file in the last
          # AGENT_HEALTHY_HOURS, assume the agent - not the issue - is the
          # problem, and leave the queue alone.
          # ---------------------------------------------------------------
          AGENT_HEALTHY_HOURS=6
          HEALTH_SINCE=$(date -u -d "${AGENT_HEALTHY_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          RECENT_AGENT_PRS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&sort=created&direction=desc&per_page=50" \
            --jq --arg since "$HEALTH_SINCE" \
            '[.[] | select(.user.login == "Copilot" or (.user.login | endswith("[bot]"))) | select(.created_at >= $since) | .number] | .[]' 2>/dev/null || true)

          AGENT_HEALTHY=unknown
          for PRN in $RECENT_AGENT_PRS; do
            CF=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRN}" --jq '.changed_files' 2>/dev/null || echo 0)
            case "$CF" in ''|*[!0-9]*) CF=0 ;; esac
            if [ "$CF" -gt 0 ]; then AGENT_HEALTHY=yes; break; fi
          done

          # No pull requests at all in the window is not evidence of ill health -
          # a quiet queue looks the same. Only an agent that opened pull requests
          # and put nothing in them is a sick agent.
          if [ "$AGENT_HEALTHY" = "unknown" ] && [ -n "${RECENT_AGENT_PRS:-}" ]; then
            AGENT_HEALTHY=no
          fi
          echo "Coding agent produced files in the last ${AGENT_HEALTHY_HOURS}h: ${AGENT_HEALTHY}"

          # ---------------------------------------------------------------
          # Guard 1: a daily ceiling on builds.
          #
          # The Copilot allowance is the real limit and it fails safe - it
          # stopped a runaway on 22 Aug, which is what a budget is for. This is
          # the softer stop underneath it, so an unusual day is noticed before
          # the hard one fires. Deliberately left out during the initial
          # build-out; the backlog is built now and work is iterative.
          #
          # Counts BUILDS - Copilot pull requests opened in a rolling 24h - not
          # workflow runs. Counting runs is what made the elaborate/architect
          # guards self-defeating: a cancelled or empty run costs nothing but
          # counted the same, so the ceiling was reached in hours and then held
          # forever. Same lesson, recorded in docs/pipeline.md.
          # ---------------------------------------------------------------
          MAX_BUILDS_PER_DAY=8
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          ALL_PRS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&sort=created&direction=desc&per_page=100" 2>/dev/null || echo '[]')
          BUILDS_TODAY=$(echo "$ALL_PRS" | jq --arg since "$SINCE" \
            '[.[] | select(.user.login == "Copilot" or (.user.login | endswith("[bot]"))) | select(.created_at >= $since)] | length' 2>/dev/null || echo 0)
          case "$BUILDS_TODAY" in ''|*[!0-9]*) BUILDS_TODAY=0 ;; esac

          echo "Copilot builds started in the last 24h: ${BUILDS_TODAY} (ceiling ${MAX_BUILDS_PER_DAY})"
          if [ "$BUILDS_TODAY" -ge "$MAX_BUILDS_PER_DAY" ]; then
            echo "::warning::Daily build ceiling of ${MAX_BUILDS_PER_DAY} reached. Queued issues keep their label and resume once the window clears. Raise MAX_BUILDS_PER_DAY here if a bigger day is intended."
            echo "numbers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---------------------------------------------------------------
          # Guard 2: close a session that produced nothing.
          #
          # #81 and #156 each consumed a Copilot session and opened a pull
          # request containing ZERO files. #81 is the worse case - it merged
          # empty and auto-closed its issue, so #75 was silently never built.
          #
          # A Copilot pull request with no changed files after the grace period
          # is unambiguous: nothing is coming. Detecting it by file count is
          # both faster and surer than the timeout path, which waits 20 minutes
          # and then re-spends before giving up. It also unblocks the queue,
          # since a dud otherwise counts as a build in flight forever.
          # ---------------------------------------------------------------
          DUD_AFTER_MIN=10
          OPEN_COPILOT_PRS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '[.[] | select(.user.login == "Copilot" or (.user.login | endswith("[bot]"))) | {number, created_at}] | .[] | "\(.number) \(.created_at)"' 2>/dev/null || true)

          while read -r PRNUM PRTIME; do
            [ -z "${PRNUM:-}" ] && continue
            AGE=$(( ( $(date -u +%s) - $(date -u -d "$PRTIME" +%s) ) / 60 ))
            [ "$AGE" -lt "$DUD_AFTER_MIN" ] && continue

            FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRNUM}" --jq '.changed_files' 2>/dev/null || echo 1)
            case "$FILES" in ''|*[!0-9]*) FILES=1 ;; esac
            [ "$FILES" -gt 0 ] && continue

            if [ "$AGENT_HEALTHY" = "no" ]; then
              echo "::warning::Pull request #${PRNUM} is ${AGE}m old with zero changed files, but NO Copilot pull request has contained a file in ${AGENT_HEALTHY_HOURS}h - this looks like an exhausted allowance rather than a bad issue. Leaving it alone; check Copilot billing."
              continue
            fi

            echo "::warning::Pull request #${PRNUM} is ${AGE}m old with zero changed files - a Copilot session that produced nothing. Closing it."
            gh pr close "$PRNUM" --repo "$GITHUB_REPOSITORY" \
              --comment "Closing automatically: this pull request is ${AGE} minutes old and contains no changed files, so the coding agent session produced nothing. The issue has been marked needs-human rather than rebuilt, because a second attempt would spend another session on the same outcome.$(printf '\n\n---\n')_Generated by [Claude Code](https://claude.ai/code)_" >/dev/null 2>&1 || true

            # Take the issue out of the queue rather than re-spending on it.
            DUD_ISSUE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRNUM}" --jq '.body // ""' 2>/dev/null \
              | grep -ioE '(fixes|closes|resolves)[[:space:]]+#[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
            if [ -n "${DUD_ISSUE:-}" ]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${DUD_ISSUE}/labels" -f "labels[]=needs-human" >/dev/null 2>&1 || true
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${DUD_ISSUE}/labels/build" >/dev/null 2>&1 || true
              echo "    #${DUD_ISSUE} marked needs-human and taken out of the queue"
            fi
          done <<< "$OPEN_COPILOT_PRS"

          # Which issues genuinely have work in progress: an OPEN Copilot pull
          # request that says it closes them. This is the difference between
          # "being built" and "was assigned once, and the pull request has since
          # been closed" - the second used to look identical, and an issue in
          # that state was skipped forever while still labelled 'build'. That is
          # how #135 sat queued but unbuildable after its pull request closed,
          # with every run reporting success.
          # ANY open pull request that closes the issue counts, not just
          # Copilot's. A human - or Claude in a session - can build a queued
          # issue directly, and while that pull request is open the work is
          # plainly in flight. Counting only Copilot's meant the queue could not
          # see it and dispatched a duplicate build: #161 was handed to Copilot
          # while #167, which closed it, was already open and green.
          OPEN_PR_BODIES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '[.[] | (.body // "")] | join("\n")' 2>/dev/null || echo "")
          IN_FLIGHT_ISSUES=$(echo "$OPEN_PR_BODIES" \
            | grep -ioE '(fixes|closes|resolves)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)
          IN_FLIGHT=$(echo "$IN_FLIGHT_ISSUES" | grep -c . || true)
          IN_FLIGHT=${IN_FLIGHT:-0}

          echo "Builds in flight (any open pull request closing a queued issue): ${IN_FLIGHT}"
          if [ "$IN_FLIGHT" -ge "$MAX_IN_FLIGHT" ]; then
            echo "::notice::${IN_FLIGHT} build(s) already in flight (limit ${MAX_IN_FLIGHT}). Waiting - parallel builds conflict in frontend/index.html."
            echo "numbers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for NUM in $(echo "$CANDIDATES" | jq -r '.[].number'); do
            echo "--- considering #${NUM}"

            ASSIGNED=$(echo "$CANDIDATES" | jq -r --argjson n "$NUM" '.[] | select(.number==$n) | .assignees | join(",")')
            if echo "$ASSIGNED" | grep -qi 'copilot'; then
              if echo "$IN_FLIGHT_ISSUES" | grep -qx "$NUM"; then
                echo "    being built now (open Copilot pull request) - skipping"
                continue
              fi
              # Assigned, but nothing open is building it. Two very different
              # situations look identical here:
              #
              #   1. Copilot was assigned seconds ago and has not opened its
              #      draft pull request yet - normally a minute or two.
              #   2. The pull request was closed or abandoned, so nothing will
              #      ever build this and the issue is stuck forever.
              #
              # Treating (1) as (2) un-assigns Copilot mid-startup and assigns
              # it again, so two sessions work the same issue and produce
              # conflicting branches. So only call it stale once the assignment
              # is older than the grace period.
              STALE_AFTER_MIN=20
              ASSIGNED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUM}/events?per_page=100" \
                --jq '[.[] | select(.event == "assigned")] | last | .created_at' 2>/dev/null || echo "")

              AGE_MIN=99999
              if [ -n "$ASSIGNED_AT" ] && [ "$ASSIGNED_AT" != "null" ]; then
                AGE_MIN=$(( ( $(date -u +%s) - $(date -u -d "$ASSIGNED_AT" +%s) ) / 60 ))
              fi

              if [ "$AGE_MIN" -lt "$STALE_AFTER_MIN" ]; then
                echo "    assigned ${AGE_MIN}m ago, no pull request yet - Copilot is probably still starting up, leaving it"
                continue
              fi

              # Cap the retries. Re-assigning forever is what an exhausted
              # Copilot allowance looks like from in here: every attempt times
              # out, every attempt costs a request the moment credits return,
              # and the queue reports success throughout. After two goes, stop
              # and say so.
              MAX_ASSIGN_ATTEMPTS=2
              ASSIGN_COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUM}/events?per_page=100" \
                --jq '[.[] | select(.event == "assigned") | select(.assignee.login // "" | ascii_downcase | contains("copilot"))] | length' \
                2>/dev/null || echo 0)
              case "$ASSIGN_COUNT" in ''|*[!0-9]*) ASSIGN_COUNT=0 ;; esac

              if [ "$ASSIGN_COUNT" -ge "$MAX_ASSIGN_ATTEMPTS" ] && [ "$AGENT_HEALTHY" = "no" ]; then
                echo "    ::warning::#${NUM} has been handed to Copilot ${ASSIGN_COUNT} times with no pull request, but the agent has produced nothing at all in ${AGENT_HEALTHY_HOURS}h. Leaving it queued rather than blaming the issue - check Copilot billing."
                continue
              fi

              if [ "$ASSIGN_COUNT" -ge "$MAX_ASSIGN_ATTEMPTS" ]; then
                echo "    ::warning::#${NUM} has been handed to Copilot ${ASSIGN_COUNT} times and never produced a pull request. Marking needs-human and taking it out of the queue."
                gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${NUM}/labels" \
                  -f "labels[]=needs-human" >/dev/null 2>&1 || true
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${NUM}/labels/build" >/dev/null 2>&1 || true
                continue
              fi

              echo "    ::warning::#${NUM} has been assigned to Copilot for ${AGE_MIN}m with no open pull request (attempt ${ASSIGN_COUNT}) - stale, re-queueing it"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${NUM}/assignees" \
                -f "assignees[]=Copilot" >/dev/null 2>&1 \
                || echo "    ::warning::could not clear the stale assignee on #${NUM}; it will be retried next run"
            fi

            # An epic (has sub-issues) is never built directly.
            SUBS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUM}/sub_issues" --jq 'length' 2>/dev/null || echo 0)
            if [ "$SUBS" -gt 0 ]; then
              echo "    has ${SUBS} sub-issues (epic) - skipping"
              continue
            fi

            # Dependencies: the Elaborator writes "Depends on #N" / "depends on
            # #32 and #33". If any referenced issue is still open, wait.
            BODY=$(echo "$CANDIDATES" | jq -r --argjson n "$NUM" '.[] | select(.number==$n) | .body')
            DEPS=$(echo "$BODY" | grep -ioE 'depends on[^.]*' | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true)
            BLOCKED=""
            for D in $DEPS; do
              STATE=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${D}" --jq '.state' 2>/dev/null || echo "unknown")
              if [ "$STATE" = "open" ]; then
                BLOCKED="${BLOCKED} #${D}"
              fi
            done
            if [ -n "$BLOCKED" ]; then
              echo "    blocked by open dependency:${BLOCKED} - skipping"
              continue
            fi

            echo "    ready to build"
            READY="${READY} ${NUM}"
            PICKED=$((PICKED + 1))
            if [ "$PICKED" -ge "$MAX_PER_RUN" ]; then break; fi
          done

          READY=$(echo "$READY" | xargs || true)
          if [ -z "$READY" ]; then
            echo "Nothing ready this round (all queued items are being built, epics, or blocked)."
          else
            echo "Building:${READY}"
          fi
          echo "numbers=${READY}" >> "$GITHUB_OUTPUT"

      - name: Assign the Copilot coding agent
        if: steps.pick.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ secrets.HEROTASK_GITHUB_TOKEN }}
          NUMBERS: ${{ steps.pick.outputs.numbers }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          BOT_ID=$(gh api graphql -f query='
            query($owner:String!, $repo:String!) {
              repository(owner:$owner, name:$repo) {
                suggestedActors(capabilities:[CAN_BE_ASSIGNED], first:100) {
                  nodes { login __typename ... on Bot { id } ... on User { id } }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" \
            --jq '.data.repository.suggestedActors.nodes[] | select(.login=="copilot-swe-agent") | .id')

          if [ -z "$BOT_ID" ]; then
            echo "::error::Copilot coding agent is not assignable on this repository."
            exit 1
          fi

          for NUM in $NUMBERS; do
            ISSUE_ID=$(gh api graphql -f query='
              query($owner:String!, $repo:String!, $num:Int!) {
                repository(owner:$owner, name:$repo) { issue(number:$num) { id } }
              }' -f owner="$OWNER" -f repo="$REPO" -F num="$NUM" \
              --jq '.data.repository.issue.id')

            if ERR=$(gh api graphql -f query='
              mutation($assignable:ID!, $actor:ID!) {
                replaceActorsForAssignable(input:{assignableId:$assignable, actorIds:[$actor]}) {
                  assignable { ... on Issue { number } }
                }
              }' -f assignable="$ISSUE_ID" -f actor="$BOT_ID" 2>&1); then
              echo "Copilot assigned to #${NUM}"
            else
              # Do not fail the run. The issue keeps its 'build' label and stays
              # unassigned, so the next pass picks it up again - which is what
              # makes a rate limit or a blip self-healing rather than a stall.
              echo "::warning::could not assign Copilot to #${NUM}, will retry next pass: ${ERR}"
            fi
          done
