name: Build queue

# Drains the build queue: every few hours, picks the next issue labelled
# 'build' that is ready to work on, and hands it to the Copilot coding agent.
#
# Why a queue rather than building on the label directly:
#   - Copilot credits are finite and monthly (~20-28 builds). Labelling four
#     sub-issues at once would blow through a daily cap, and skipped runs never
#     retry, so work would silently never get built.
#   - Sub-issues have dependencies. #34 built before #33 lands means Copilot
#     writes against an API that does not exist yet and invents one.
#
# So 'build' means "queued", and this picks one at a time, in order, skipping
# anything whose dependencies are still open.
#
# When it runs: on the events that can change what is buildable, so work starts
# as soon as it is unblocked rather than waiting for a clock:
#   - a 'build' label added        -> that issue may be ready right now
#   - a pull request closed/merged -> whatever depended on it may be unblocked
#   - an issue closed              -> same
#
# The half-hourly schedule is a FAILURE BACKSTOP, not polling.
#
# Events cover the happy path: the merge job uses a real token now, so a merged
# pull request raises its events and the queue moves the moment something
# unblocks. The five-minute sweeps that used to paper over that are gone.
#
# But events only fire when something CHANGES. Nothing fires when a run FAILS.
# That gap is not hypothetical: this workflow failed to assign #73 because the
# account's API rate limit was exhausted, and with no schedule at all nothing
# retried - the whole build stalled silently until a human noticed.
#
# So: half-hourly, purely so a transient failure heals itself. Rare enough not
# to be the noise the old sweeps were, frequent enough that nobody has to spot
# a stall.
#
# MAX_PER_RUN caps how many start at once, and it is 1 deliberately.
#
# Running builds in parallel looks faster and is not. Almost every sub-issue
# edits api/src/functions/hero.js or frontend/index.html, so concurrent Copilot
# branches conflict with each other: the first merges, the rest need a human to
# resolve, and auto-merge cannot. #57 and #58 hit this within minutes of each
# other. One at a time means each build branches off code that already contains
# the one before it, so conflicts mostly cannot arise - which is what actually
# keeps the pipeline unattended.

on:
  issues:
    types: [labeled, closed]
  pull_request:
    types: [closed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: copilot-build
  cancel-in-progress: false

jobs:
  next:
    # Skip label events for labels other than 'build' - every other event type
    # (closed issue, closed PR, schedule, manual) is worth a look at the queue.
    if: >-
      github.event_name != 'issues' ||
      github.event.action == 'closed' ||
      github.event.label.name == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pick the next buildable issue
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Open issues labelled 'build', oldest first so sub-issues are built
          # in the order the Elaborator created them.
          CANDIDATES=$(gh api "repos/${GITHUB_REPOSITORY}/issues?labels=build&state=open&sort=created&direction=asc&per_page=100" \
            --jq '[.[] | select(has("pull_request") | not) | {number, body: (.body // ""), assignees: [.assignees[].login]}]')

          MAX_PER_RUN=1
          # How many builds may be OPEN AT ONCE, across all runs. MAX_PER_RUN
          # only ever limited a single run: because an assigned issue is
          # skipped, each subsequent run handed out another one, and six
          # Copilot branches ended up in flight together. They all edit
          # frontend/index.html, so every one conflicted with main, and
          # auto-merge - which cannot resolve a conflict - jammed for hours.
          # #62 set MAX_PER_RUN=1 intending exactly this, and capped the wrong
          # thing.
          MAX_IN_FLIGHT=1

          READY=""
          PICKED=0

          COUNT=$(echo "$CANDIDATES" | jq 'length')
          echo "Issues labelled 'build': ${COUNT}"
          if [ "$COUNT" -eq 0 ]; then
            echo "Queue empty - nothing to do."
            echo "numbers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Which issues genuinely have work in progress: an OPEN Copilot pull
          # request that says it closes them. This is the difference between
          # "being built" and "was assigned once, and the pull request has since
          # been closed" - the second used to look identical, and an issue in
          # that state was skipped forever while still labelled 'build'. That is
          # how #135 sat queued but unbuildable after its pull request closed,
          # with every run reporting success.
          OPEN_PR_BODIES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '[.[] | select(.user.login == "Copilot" or (.user.login | endswith("[bot]"))) | (.body // "")] | join("\n")' 2>/dev/null || echo "")
          IN_FLIGHT_ISSUES=$(echo "$OPEN_PR_BODIES" \
            | grep -ioE '(fixes|closes|resolves)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)
          IN_FLIGHT=$(echo "$IN_FLIGHT_ISSUES" | grep -c . || true)
          IN_FLIGHT=${IN_FLIGHT:-0}

          echo "Builds in flight (open Copilot pull requests): ${IN_FLIGHT}"
          if [ "$IN_FLIGHT" -ge "$MAX_IN_FLIGHT" ]; then
            echo "::notice::${IN_FLIGHT} build(s) already in flight (limit ${MAX_IN_FLIGHT}). Waiting - parallel builds conflict in frontend/index.html."
            echo "numbers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for NUM in $(echo "$CANDIDATES" | jq -r '.[].number'); do
            echo "--- considering #${NUM}"

            ASSIGNED=$(echo "$CANDIDATES" | jq -r --argjson n "$NUM" '.[] | select(.number==$n) | .assignees | join(",")')
            if echo "$ASSIGNED" | grep -qi 'copilot'; then
              if echo "$IN_FLIGHT_ISSUES" | grep -qx "$NUM"; then
                echo "    being built now (open Copilot pull request) - skipping"
                continue
              fi
              # Assigned, but nothing open is building it. Two very different
              # situations look identical here:
              #
              #   1. Copilot was assigned seconds ago and has not opened its
              #      draft pull request yet - normally a minute or two.
              #   2. The pull request was closed or abandoned, so nothing will
              #      ever build this and the issue is stuck forever.
              #
              # Treating (1) as (2) un-assigns Copilot mid-startup and assigns
              # it again, so two sessions work the same issue and produce
              # conflicting branches. So only call it stale once the assignment
              # is older than the grace period.
              STALE_AFTER_MIN=20
              ASSIGNED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUM}/events?per_page=100" \
                --jq '[.[] | select(.event == "assigned")] | last | .created_at' 2>/dev/null || echo "")

              AGE_MIN=99999
              if [ -n "$ASSIGNED_AT" ] && [ "$ASSIGNED_AT" != "null" ]; then
                AGE_MIN=$(( ( $(date -u +%s) - $(date -u -d "$ASSIGNED_AT" +%s) ) / 60 ))
              fi

              if [ "$AGE_MIN" -lt "$STALE_AFTER_MIN" ]; then
                echo "    assigned ${AGE_MIN}m ago, no pull request yet - Copilot is probably still starting up, leaving it"
                continue
              fi

              echo "    ::warning::#${NUM} has been assigned to Copilot for ${AGE_MIN}m with no open pull request - stale, re-queueing it"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${NUM}/assignees" \
                -f "assignees[]=Copilot" >/dev/null 2>&1 \
                || echo "    ::warning::could not clear the stale assignee on #${NUM}; it will be retried next run"
            fi

            # An epic (has sub-issues) is never built directly.
            SUBS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUM}/sub_issues" --jq 'length' 2>/dev/null || echo 0)
            if [ "$SUBS" -gt 0 ]; then
              echo "    has ${SUBS} sub-issues (epic) - skipping"
              continue
            fi

            # Dependencies: the Elaborator writes "Depends on #N" / "depends on
            # #32 and #33". If any referenced issue is still open, wait.
            BODY=$(echo "$CANDIDATES" | jq -r --argjson n "$NUM" '.[] | select(.number==$n) | .body')
            DEPS=$(echo "$BODY" | grep -ioE 'depends on[^.]*' | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true)
            BLOCKED=""
            for D in $DEPS; do
              STATE=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${D}" --jq '.state' 2>/dev/null || echo "unknown")
              if [ "$STATE" = "open" ]; then
                BLOCKED="${BLOCKED} #${D}"
              fi
            done
            if [ -n "$BLOCKED" ]; then
              echo "    blocked by open dependency:${BLOCKED} - skipping"
              continue
            fi

            echo "    ready to build"
            READY="${READY} ${NUM}"
            PICKED=$((PICKED + 1))
            if [ "$PICKED" -ge "$MAX_PER_RUN" ]; then break; fi
          done

          READY=$(echo "$READY" | xargs || true)
          if [ -z "$READY" ]; then
            echo "Nothing ready this round (all queued items are being built, epics, or blocked)."
          else
            echo "Building:${READY}"
          fi
          echo "numbers=${READY}" >> "$GITHUB_OUTPUT"

      - name: Assign the Copilot coding agent
        if: steps.pick.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ secrets.HEROTASK_GITHUB_TOKEN }}
          NUMBERS: ${{ steps.pick.outputs.numbers }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          BOT_ID=$(gh api graphql -f query='
            query($owner:String!, $repo:String!) {
              repository(owner:$owner, name:$repo) {
                suggestedActors(capabilities:[CAN_BE_ASSIGNED], first:100) {
                  nodes { login __typename ... on Bot { id } ... on User { id } }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" \
            --jq '.data.repository.suggestedActors.nodes[] | select(.login=="copilot-swe-agent") | .id')

          if [ -z "$BOT_ID" ]; then
            echo "::error::Copilot coding agent is not assignable on this repository."
            exit 1
          fi

          for NUM in $NUMBERS; do
            ISSUE_ID=$(gh api graphql -f query='
              query($owner:String!, $repo:String!, $num:Int!) {
                repository(owner:$owner, name:$repo) { issue(number:$num) { id } }
              }' -f owner="$OWNER" -f repo="$REPO" -F num="$NUM" \
              --jq '.data.repository.issue.id')

            if ERR=$(gh api graphql -f query='
              mutation($assignable:ID!, $actor:ID!) {
                replaceActorsForAssignable(input:{assignableId:$assignable, actorIds:[$actor]}) {
                  assignable { ... on Issue { number } }
                }
              }' -f assignable="$ISSUE_ID" -f actor="$BOT_ID" 2>&1); then
              echo "Copilot assigned to #${NUM}"
            else
              # Do not fail the run. The issue keeps its 'build' label and stays
              # unassigned, so the next pass picks it up again - which is what
              # makes a rate limit or a blip self-healing rather than a stall.
              echo "::warning::could not assign Copilot to #${NUM}, will retry next pass: ${ERR}"
            fi
          done
