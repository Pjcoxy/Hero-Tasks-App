name: CI

# Runs the API logic tests on every pull request and on pushes to main.
# This is the check auto-merge waits for - if it is red, nothing merges.
#
# Why pull_request_target as well as pull_request:
#   GitHub holds workflow runs on Copilot's branches at 'action_required' until
#   a maintainer approves them, and the approve API refuses. The upshot was that
#   CI never actually ran on an agent pull request - it only ran on main AFTER
#   the merge, so it reported rather than gated. pull_request_target is not
#   subject to that gate (proved on #58: its pull_request_target workflows ran
#   while everything on pull_request sat blocked).
#
#   pull_request_target runs in the BASE repo's context with access to secrets,
#   so checking out pull request code under it is normally dangerous. That is
#   why this job is fenced to SAME-REPO branches only: a branch in this
#   repository can only be pushed by someone who already has write access, so
#   there is no untrusted code involved. Fork pull requests never reach this
#   job - they keep the ordinary (approval-gated) pull_request run.

on:
  pull_request:
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    # On pull_request_target, only same-repo branches. On everything else, always.
    if: >-
      github.event_name != 'pull_request_target'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request_target checks out the base branch by default, which
          # would test the wrong code. Same-repo only, per the job condition
          # above, so this is not untrusted input.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install API dependencies
        working-directory: api
        run: npm install --no-audit --no-fund

      - name: Run API logic tests
        working-directory: api
        run: node test-logic.js

      - name: Check the frontend still parses
        run: node scripts/check-frontend.js

      - name: Check the design system is respected
        run: node scripts/check-design.js

      - name: Check every workflow file parses
        # The pipeline is unattended, so a malformed workflow would merge and
        # quietly stop something running. Two have been broken by hand already:
        # an inline `node -e` containing a colon, and a `---` at column 0 inside
        # a run block starting a second YAML document.
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(f))
                  print(f"ok     {f}")
              except yaml.YAMLError as e:
                  bad.append(f)
                  print(f"BROKEN {f}\n{e}")
          sys.exit(1 if bad else 0)
          EOF

  smoke:
    # Deliberately a SEPARATE job, not more steps on 'test'.
    #
    # auto-merge.yml gates on a check run named exactly 'test', so this one does
    # not block a merge yet. That is on purpose: the pipeline is unattended, and
    # a flaky browser test would bounce Copilot pull requests back for no reason.
    # It proves itself here first. Once it has a run of green weeks, add 'smoke'
    # to the gate in auto-merge.yml - until then it reports rather than gates,
    # which is the same weak position ci.yml itself was in before #63, and worth
    # not leaving indefinitely.
    if: >-
      github.event_name != 'pull_request_target'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install API dependencies
        working-directory: api
        run: npm install --no-audit --no-fund

      - name: Install Playwright
        working-directory: tests/smoke
        # The browser itself is already on the runner image - this installs the
        # test runner only. PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD stops the
        # postinstall hook fetching one on every run.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-audit --no-fund

      - name: Locate the preinstalled Chromium
        id: chromium
        # Playwright pins an exact browser build per release, so the path moves
        # when either the image or the package updates. Find it rather than
        # hardcode it, and say so plainly if it is missing instead of silently
        # falling back to a download.
        run: |
          BIN=$(find "${PLAYWRIGHT_BROWSERS_PATH:-/opt/pw-browsers}" \
                  -maxdepth 3 -type f -name chrome 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::No preinstalled Chromium found under ${PLAYWRIGHT_BROWSERS_PATH:-/opt/pw-browsers}"
            exit 1
          fi
          echo "Using $BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"

      - name: Smoke test the running app
        env:
          SMOKE_CHROMIUM: ${{ steps.chromium.outputs.path }}
        run: npx --prefix tests/smoke playwright test -c tests/smoke/playwright.config.js

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-traces
          path: tests/smoke/test-results/
          retention-days: 7
