name: Architect an issue

# The "architect" label IS the queue - same design as elaborate.yml, and for the
# same reason: the Elaborator can label several sub-issues in one pass, and
# GitHub's concurrency queue only holds one pending run, so reacting to the
# label event directly would silently drop all but the last.
#
# Drains one issue at a time, oldest first, posting a technical approach as a
# comment. Writes no code. On success it swaps 'architect' for 'architected'.
#
# Wakes on: a label being added, and manual dispatch. Dispatch
# with an issue number to jump the queue; leave it blank to just drain.
#
# What bounds the spend:
#   1. The queue itself. Only labelled issues run, each runs once, and the
#      label comes off afterwards - so the ceiling is (issues labelled) x
#      ~$0.50.
#   2. A $2 hard cap per session, set in the runner.
#   3. Skipping anything already marked 'architected' - the one way this could
#      loop is a failed label removal, and that closes it.
#   4. A runaway ceiling of 80 runs per rolling 24h, below.
#
# The ceiling counts RUNS, so keep it well clear of however often this fires.
# A ceiling of 20 against a 5-minute sweep was crossed within two hours and then
# held forever, after which nothing would ever run again - a guard that becomes
# the outage. There is no sweep now: the label event starts this, and each
# finished run dispatches the next itself.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to jump the queue with (blank = drain the queue)"
        required: false
  issues:
    types: [labeled]
  # Backstop. The label event and the self-dispatch below are what normally
  # move the queue; this catches the cases where neither fires - a failed run,
  # a dispatch that could not be made, or a label added while a run was already
  # going. Without it a stall is permanent and silent, which is exactly what
  # happened when thirteen issues were labelled at once.
  schedule:
    - cron: "*/30 * * * *"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: architect-run
  cancel-in-progress: false

jobs:
  architect:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || github.event.label.name == 'architect'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Runaway guard (max 40 issues per rolling 24h)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Counts ISSUES WORKED, not workflow runs.
          #
          # This used to count runs, and that was wrong twice over. A run that
          # is cancelled by the concurrency group, skipped by a guard, or that
          # finds an empty queue costs nothing - but it counted the same as a
          # real one. With a sweep on the clock the ceiling was reached within
          # hours and then held forever, stalling the queue permanently. That
          # is why the sweeps were deleted in #59; counting the right thing is
          # what lets a backstop schedule exist again.
          #
          # What actually costs money is one issue being worked. The
          # 'architected' label is applied exactly once per issue, so counting
          # issues that carry it and were touched recently measures spend
          # directly, and is immune to however often this workflow wakes up.
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%d)
          COUNT=$(gh api "search/issues?q=repo:${GITHUB_REPOSITORY}+label:architected+updated:%3E%3D${SINCE}" \
            --jq '.total_count // 0' 2>/dev/null || echo 0)

          # Fail OPEN, never closed. A guard that cannot read its own number
          # must not be the thing that stops the pipeline - that is the failure
          # mode this whole change exists to remove.
          case "$COUNT" in ''|*[!0-9]*) COUNT=0 ;; esac
          echo "Issues architected in the last 24h: ${COUNT}"
          if [ "${COUNT:-0}" -gt 40 ]; then
            echo "::notice::Runaway ceiling of 40 issues reached. Labelled issues stay queued and resume once the window clears."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Take the next issue off the queue
        if: steps.guard.outputs.ok == 'true'
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          MANUAL="${{ github.event.inputs.issue_number }}"
          if [ -n "$MANUAL" ]; then
            echo "Jumping the queue with #${MANUAL}."
            echo "number=${MANUAL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          QUEUE=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=architect&sort=created&direction=asc&per_page=100" \
            --jq '[.[] | select(.pull_request == null) | {number, title}]' 2>/dev/null || echo '[]')

          DEPTH=$(echo "$QUEUE" | jq 'length')
          if [ "$DEPTH" -eq 0 ]; then
            echo "Queue empty - nothing labelled 'architect'."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Queue depth ${DEPTH}:"
          echo "$QUEUE" | jq -r '.[] | "  #\(.number)  \(.title)"'

          NEXT=$(echo "$QUEUE" | jq -r '.[0].number')

          # Already done? Then 'architect' was left behind by a failed label
          # removal. Clear it rather than paying to redo the work - this is the
          # only way the queue could loop.
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${NEXT}/labels" --jq '.[].name' 2>/dev/null | grep -qx 'architected'; then
            echo "#${NEXT} is already architected - clearing the stale label instead of rerunning."
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${NEXT}/labels/architect" >/dev/null 2>&1 || true
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Taking #${NEXT}."
          echo "number=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "remaining=$((DEPTH - 1))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.issue.outputs.number != ''

      - uses: actions/setup-python@v5
        if: steps.issue.outputs.number != ''
        with:
          python-version: "3.12"

      - name: Install Anthropic SDK
        if: steps.issue.outputs.number != ''
        run: pip install anthropic

      - name: Run the Architect
        if: steps.issue.outputs.number != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.HEROTASK_ANTHROPIC_KEY }}
          HEROTASK_GITHUB_TOKEN: ${{ secrets.HEROTASK_GITHUB_TOKEN }}
        run: python ops/architect/run_architect.py "${{ steps.issue.outputs.number }}"

      - name: Take it off the queue
        if: success() && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ steps.issue.outputs.number }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${NUM}/labels/architect" >/dev/null 2>&1 \
            && echo "Removed 'architect' from #${NUM}." \
            || echo "::warning::Could not remove 'architect' from #${NUM} - it will be picked up again."

          # 'architected' is optional - if the label does not exist, skip it.
          if gh api "repos/${GITHUB_REPOSITORY}/labels/architected" >/dev/null 2>&1; then
            gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --add-label architected >/dev/null 2>&1 \
              && echo "Marked #${NUM} architected."
          fi

      - name: Wake the next one straight away
        # Re-reads the queue rather than trusting the count taken at the START
        # of this run. A run takes several minutes, and anything labelled
        # during that window was invisible to that earlier count - so a queue
        # of thirteen looked like a queue of one, this step was skipped, and
        # the chain stopped dead after a single issue.
        #
        # Needs HEROTASK_GITHUB_TOKEN to carry Actions: Read and write - the
        # built-in token cannot dispatch a workflow. Failure here is survivable
        # now that the schedule above exists as a backstop.
        if: success() && steps.issue.outputs.number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HEROTASK_GITHUB_TOKEN }}
        run: |
          LEFT=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=architect&per_page=100" \
            --jq '[.[] | select(.pull_request == null)] | length' 2>/dev/null || echo 0)

          if [ "${LEFT:-0}" -eq 0 ]; then
            echo "Queue empty - nothing left to wake."
            exit 0
          fi

          gh workflow run architect.yml --repo "$GITHUB_REPOSITORY" --ref main \
            && echo "Dispatched the next drain (${LEFT} left)." \
            || echo "::notice::Could not self-dispatch; the backstop schedule will take the next one."
