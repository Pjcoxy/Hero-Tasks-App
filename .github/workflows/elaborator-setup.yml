name: Elaborator - one-time setup

# Run this manually (Actions tab -> "Elaborator - one-time setup" -> Run workflow)
# after adding the ANTHROPIC_API_KEY and ELABORATOR_GITHUB_TOKEN repo secrets.
# It creates the Anthropic-hosted agent/environment/vault and commits their IDs
# back to ops/elaborator/agent_config.json. Safe to re-run (updates the agent
# definition in place).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: elaborator-setup

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Anthropic SDK
        run: pip install anthropic

      - name: Create/update the Elaborator agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELABORATOR_GITHUB_TOKEN: ${{ secrets.ELABORATOR_GITHUB_TOKEN }}
        run: python ops/elaborator/setup_elaborator.py

      - name: Commit agent_config.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/elaborator/agent_config.json
          git diff --cached --quiet && echo "No config changes" && exit 0
          git commit -m "Update elaborator agent config (setup workflow)"
          git push
