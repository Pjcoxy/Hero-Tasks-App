name: Deploy to Azure

# Deploys whichever part of the app changed. Replaces the manual Cloud Shell
# steps in docs/deploy-app.md (those still work as a fallback).
#
# Runs on push to main. That is enough because auto-merge.yml merges with a
# real personal token: GitHub raises no workflow events for the built-in
# GITHUB_TOKEN, so while the merge job used it an auto-merged pull request
# fired no push here at all and the change sat undeployed. That is what
# happened to the Rewards UI in #48/#49.
#
# The 'deployed' tag is the source of truth for what is on Azure, so a run
# deploys everything changed since the last SUCCESSFUL deploy rather than just
# HEAD^. A failed deploy leaves the tag where it is and the next push retries
# it, and several commits landing together cannot hide each other.
#
# Every job checks out ${{ github.sha }} - this run's own commit - and never
# 'main'. When #175 and #176 merged 45 seconds apart, the deploy job correctly
# uploaded #175's commit, but the record job checked out 'main' (already moved
# on to #176) and tagged THAT as deployed. #176's own run then compared main
# against the tag, found them identical, logged "Nothing changed since the last
# deploy" and skipped every job - green, having shipped nothing. The commit sat
# undeployed while the pipeline reported success.
#
# Required repository secrets:
#   AZURE_STATIC_WEB_APPS_API_TOKEN  - Static Web App deployment token
#                                      (Portal -> herotasks-swa-dev -> Manage
#                                      deployment token)
#   AZURE_FUNCTIONAPP_PUBLISH_PROFILE - Function App publish profile XML
#                                      (Portal -> herotasks-func-dev ->
#                                      Get publish profile)
#
# Until both secrets exist the relevant job is skipped with a notice rather
# than failing the run, so merges are never blocked by missing credentials.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # This run's own commit, NOT 'main'. A later merge can move main
          # while this run is still queued, and then the run reports on a
          # commit it is not deploying. That is exactly how #176 was skipped.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Detect what changed since the last successful deploy
        id: filter
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Manual run - deploying both."
            exit 0
          fi

          # Compare against the 'deployed' tag: what is actually live. Falls
          # back to the previous commit only until the tag first exists.
          if git rev-parse -q --verify refs/tags/deployed >/dev/null; then
            BASE=$(git rev-parse refs/tags/deployed^{commit})
            if ! git merge-base --is-ancestor "$BASE" HEAD; then
              echo "::warning::'deployed' tag is not an ancestor of main - falling back to HEAD^."
              BASE=$(git rev-parse HEAD^)
            fi
          else
            # No tag yet - fall back to the previous commit. The record job
            # creates the tag after the first deploy that ships something.
            BASE=$(git rev-parse HEAD^)
          fi

          echo "Deployed: $BASE"
          echo "main:     $(git rev-parse HEAD)"

          CHANGED=$(git diff --name-only "$BASE" HEAD || echo "")
          if [ -z "$CHANGED" ]; then
            echo "Nothing changed since the last deploy."
          else
            echo "Changed files:"; echo "$CHANGED"
          fi
          echo "api=$(echo "$CHANGED" | grep -q '^api/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(echo "$CHANGED" | grep -q '^frontend/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check for publish profile
        id: check
        run: |
          if [ -z "${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}" ]; then
            echo "::notice::AZURE_FUNCTIONAPP_PUBLISH_PROFILE not set - skipping API deploy. Add it in Settings -> Secrets -> Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: "20"

      - name: Install production dependencies
        if: steps.check.outputs.ok == 'true'
        working-directory: api
        run: npm install --omit=dev --no-audit --no-fund

      - name: Deploy to Function App
        if: steps.check.outputs.ok == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: herotasks-func-dev
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check for deployment token
        id: check
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN not set - skipping frontend deploy. Add it in Settings -> Secrets -> Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Static Web App
        if: steps.check.outputs.ok == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend
          skip_app_build: true
          skip_api_build: true

  record:
    # Moves the 'deployed' tag to what was just shipped, so the next run knows
    # where to start. Only runs when nothing failed - a failed deploy leaves
    # the tag behind and gets retried on the next sweep.
    needs: [changes, deploy-api, deploy-frontend]
    if: >-
      always() && needs.changes.result == 'success'
      && (needs.changes.outputs.api == 'true' || needs.changes.outputs.frontend == 'true')
      && needs.deploy-api.result != 'failure' && needs.deploy-frontend.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason as the 'changes' job: tag the commit this run actually
          # deployed. Checking out 'main' tagged whatever had merged in the
          # meantime, marking an undeployed commit as live and causing the very
          # next run to skip everything as "nothing changed".
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Mark this commit as deployed
        run: |
          set -euo pipefail

          # Runs are serialised by the concurrency group, but a retry or a
          # re-run of an older run can still arrive late. Never move the tag
          # backwards - that would re-deploy old code over new.
          if git rev-parse -q --verify refs/tags/deployed >/dev/null 2>&1; then
            PREV=$(git rev-parse refs/tags/deployed^{commit})
            if [ "$PREV" = "${{ github.sha }}" ]; then
              echo "Already tagged - nothing to do."
              exit 0
            fi
            if ! git merge-base --is-ancestor "$PREV" "${{ github.sha }}"; then
              echo "::warning::deployed ($PREV) is not an ancestor of ${{ github.sha }} - leaving the tag alone."
              exit 0
            fi
          fi

          git tag -f deployed "${{ github.sha }}"
          git push -f origin refs/tags/deployed
          echo "deployed -> ${{ github.sha }}"
