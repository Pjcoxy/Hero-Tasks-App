name: Architect - one-time setup

# Run this manually (Actions tab -> "Architect - one-time setup" -> Run workflow).
# Requires the Elaborator setup to have run first: the Architect reuses its
# environment and vault. Safe to re-run - updates the agent in place.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: architect-setup

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Anthropic SDK
        run: pip install anthropic

      - name: Create/update the Architect agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.HEROTASK_ANTHROPIC_KEY }}
          HEROTASK_GITHUB_TOKEN: ${{ secrets.HEROTASK_GITHUB_TOKEN }}
        run: python ops/architect/setup_architect.py

      - name: Commit agent_config.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/architect/agent_config.json
          git diff --cached --quiet && echo "No config changes" && exit 0
          git commit -m "Update architect agent config (setup workflow)"
          git push
