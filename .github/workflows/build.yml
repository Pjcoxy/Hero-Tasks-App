name: Build an issue with Copilot

# Builds ONE issue immediately, on manual dispatch. Use this to jump the queue.
#
# The 'build' label does NOT trigger this - it queues the issue for
# build-queue.yml, which drains the queue a few at a time in dependency order.
# See docs/pipeline.md for why.
#
# Guards:
#   - refuses epics (an issue with sub-issues, or carrying 'elaborated')
#   - caps builds per rolling 24h, since Copilot credits are finite

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to build now (jumps the queue)"
        required: true

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: copilot-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve issue number
        id: issue
        run: echo "number=${{ github.event.inputs.issue_number }}" >> "$GITHUB_OUTPUT"

      # No daily cap during the initial build-out: the Copilot credit budget is
      # the real limit and it fails safe on its own, so a second ceiling
      # underneath it only stalls the run. Restore a cap here (~8/day) once the
      # backlog is built and work becomes iterative.
      - name: Daily build guard (disabled for the build-out)
        id: guard
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Refuse epics
        if: steps.guard.outputs.ok == 'true'
        id: epic
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ steps.issue.outputs.number }}
        run: |
          SUBS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUM}/sub_issues" --jq 'length' 2>/dev/null || echo 0)
          LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUM}" --jq '[.labels[].name] | join(",")')
          echo "Issue #${NUM}: ${SUBS} sub-issues, labels: ${LABELS}"
          if [ "${SUBS}" -gt 0 ] || echo "${LABELS}" | grep -q 'elaborated'; then
            echo "#${NUM} is an epic - build its sub-issues instead. Skipping."
            BODY="Not handing this to the coding agent: it is an epic with sub-issues. Add the \`build\` label to the individual sub-issues instead - an epic produces a sprawling, unreviewable pull request."
            BODY="${BODY}"$'\n\n---\n'"_Generated by [Claude Code](https://claude.ai/code)_"
            gh issue comment "${NUM}" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assign the Copilot coding agent
        if: steps.guard.outputs.ok == 'true' && steps.epic.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.HEROTASK_GITHUB_TOKEN }}
          NUM: ${{ steps.issue.outputs.number }}
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          # Find the Copilot coding agent's actor id for this repo.
          BOT_ID=$(gh api graphql -f query='
            query($owner:String!, $repo:String!) {
              repository(owner:$owner, name:$repo) {
                suggestedActors(capabilities:[CAN_BE_ASSIGNED], first:100) {
                  nodes { login __typename ... on Bot { id } ... on User { id } }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" \
            --jq '.data.repository.suggestedActors.nodes[] | select(.login=="copilot-swe-agent") | .id')

          if [ -z "$BOT_ID" ]; then
            echo "::error::Copilot coding agent is not assignable on this repository."
            exit 1
          fi

          ISSUE_ID=$(gh api graphql -f query='
            query($owner:String!, $repo:String!, $num:Int!) {
              repository(owner:$owner, name:$repo) { issue(number:$num) { id } }
            }' -f owner="$OWNER" -f repo="$REPO" -F num="$NUM" \
            --jq '.data.repository.issue.id')

          gh api graphql -f query='
            mutation($assignable:ID!, $actor:ID!) {
              replaceActorsForAssignable(input:{assignableId:$assignable, actorIds:[$actor]}) {
                assignable { ... on Issue { number assignees(first:5) { nodes { login } } } }
              }
            }' -f assignable="$ISSUE_ID" -f actor="$BOT_ID"

          echo "Copilot assigned to #${NUM}"
