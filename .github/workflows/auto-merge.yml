name: Auto-merge agent PRs

# Marks finished Copilot pull requests ready for review and enables GitHub's
# auto-merge, so they merge themselves once CI is green. Human-authored pull
# requests are untouched - you merge those yourself.
#
# What wakes this up:
#   Copilot opens its pull request as a DRAFT and then works for several
#   minutes. It never fires 'ready_for_review' by itself - it just renames the
#   title from "[WIP] ..." to the final title and stops. So there is no event
#   meaning "finished", and acting on 'opened' would mark half-written work
#   ready and merge it.
#
#   The finished signal used here: authored by Copilot and the title no longer
#   starts with "[WIP]".
#
#   The primary trigger is CI completing (workflow_run below). That is the
#   moment the merge gate could newly pass, and by then Copilot has finished
#   working and renamed the title - it renames when it stops, while CI is still
#   running on its last push. Reacting to it takes the decision from tens of
#   minutes to seconds.
#
#   The cron is now only a backstop, and it is worth being honest about what it
#   actually does. It is written "*/5" but GitHub does not honour that: the
#   observed gaps between scheduled runs on this repository were 22, 23, 26,
#   31, 32, 36, 41, 44 and 48 minutes. High-frequency crons are throttled.
#   Anything that has to happen promptly cannot be hung off it.
#
# This does NOT use GitHub's --auto. That merges as soon as the *required*
# checks pass, and this repository has no branch protection, so nothing is
# required and --auto merged immediately - CI was reporting, not gating. The
# gate is enforced here instead: a pull request is merged only once a check run
# named 'test' has actually concluded successfully on its head commit.
#
# It also brings a pull request up to date with main before merging. Building
# one issue at a time makes conflicts rare, but main still moves underneath a
# pull request that is waiting, and updating first is what keeps that from
# needing a human.
#
# To stop one merging, put it back to draft.

on:
  # The real trigger: CI has just concluded on some commit, so a pull request
  # that was waiting on it may now be mergeable. Fires for CI runs on main too,
  # which is harmless - the job re-reads the whole candidate list every time and
  # does nothing when there is nothing waiting.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Backstop only. See the note above about how rarely this actually fires.
  schedule:
    - cron: "*/5 * * * *"
  # Fires when you mark something ready by hand, and on events raised by your
  # own actions (Copilot's own events are gated behind approval).
  pull_request_target:
    types: [ready_for_review]
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-agent-prs
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ready and auto-merge finished Copilot pull requests
        env:
          # Deliberately the personal token, not the built-in GITHUB_TOKEN.
          # GitHub raises no workflow events for anything GITHUB_TOKEN does, so
          # a merge made with it fires no 'push' (deploy never runs), no
          # 'pull_request: closed' and no issue auto-close (the build queue
          # never wakes). That is what left the Rewards UI merged but
          # undeployed. A merge made with a real token raises events normally,
          # which is what lets every polling sweep in this pipeline be deleted.
          GH_TOKEN: ${{ secrets.HEROTASK_GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # Open pull requests authored by Copilot that look finished: no longer
          # titled "[WIP] ...".
          #
          # Draft state is deliberately NOT part of this filter. It used to
          # require draft == true, which meant a pull request that had been
          # marked ready - by hand, or by an earlier pass of this workflow that
          # then found CI still running - dropped out of the candidate set for
          # good and needed a human to merge it. Whether it is a draft says
          # nothing about whether Copilot has finished; the title does.
          CANDIDATES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '[.[]
                   | select(.user.login == "Copilot" or (.user.login | endswith("[bot]")))
                   | select(.title | startswith("[WIP]") | not)
                   | {number, title}]' 2>/dev/null || echo '[]')

          COUNT=$(echo "$CANDIDATES" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "No finished Copilot pull requests waiting."
          else
            echo "Found ${COUNT}:"
            echo "$CANDIDATES" | jq -r '.[] | "  #\(.number)  \(.title)"'
          fi

          # A pull request marked ready by hand arrives here too - handle it in
          # the same pass so nothing is missed.
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            CANDIDATES=$(echo "$CANDIDATES" | jq --argjson n "${{ github.event.pull_request.number }}" \
              '. + [{number: $n, title: "(marked ready by hand)"}] | unique_by(.number)')
          fi

          for NUM in $(echo "$CANDIDATES" | jq -r '.[].number'); do
            echo "--- #${NUM}"

            gh pr ready "$NUM" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              && echo "    marked ready for review" \
              || echo "    already ready"

            HEAD_REF=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUM}" --jq '.head.ref')
            HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUM}" --jq '.head.sha')

            # Behind main? Bring it up to date and let CI re-run against the
            # merged result. Next cycle merges it. This is what stops a waiting
            # pull request drifting into a conflict nobody can auto-resolve.
            BEHIND=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${HEAD_REF}" --jq '.behind_by' 2>/dev/null || echo 0)
            if [ "${BEHIND:-0}" -gt 0 ]; then
              if ERR=$(gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${NUM}/update-branch" 2>&1); then
                echo "    was ${BEHIND} commits behind main - updated, will merge once CI re-runs"
              else
                echo "    ::warning::#${NUM} is ${BEHIND} behind main and could not be updated - likely a real conflict needing a human: ${ERR}"
              fi
              continue
            fi

            # The gate. Merge only on a check run named 'test' that actually
            # concluded successfully on this exact commit.
            CHECKS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "test") | .conclusion]' 2>/dev/null || echo '[]')
            echo "    test checks on ${HEAD_SHA:0:7}: $(echo "$CHECKS" | jq -c '.')"

            if echo "$CHECKS" | jq -e 'any(. == "success")' >/dev/null; then
              if ERR=$(gh pr merge "$NUM" --repo "$GITHUB_REPOSITORY" --squash 2>&1); then
                echo "    CI green - merged"
              else
                echo "    ::warning::CI is green on #${NUM} but the merge failed: ${ERR}"
              fi
            elif echo "$CHECKS" | jq -e 'any(. == "failure" or . == "timed_out" or . == "cancelled")' >/dev/null; then
              echo "    ::warning::CI is red on #${NUM} - leaving it open. This one needs looking at."
            else
              echo "    CI has not concluded yet - leaving it for the next pass"
            fi
          done
