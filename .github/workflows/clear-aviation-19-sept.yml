# Manually-triggered one-shot: clear the triplicated Perth Aviation Youth Club
# meeting from Saturday 19 Sept 2026 on the LIVE app (Toby is at camp).
# A repeating item is never deleted - that occurrence is skipped instead.
# Never runs on its own - workflow_dispatch only.
name: Clear aviation 19 Sept

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clear-aviation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clear the aviation meeting from 19 Sept
        run: node scripts/clear-aviation-19-sept.mjs
